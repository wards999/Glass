name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p glass-core --all-targets -- -D warnings
      - run: cargo test -p glass-core
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - name: C header is up to date
        working-directory: core
        run: |
          cbindgen --config cbindgen.toml --output include/glass_core.h
          git diff --exit-code -- include/

  app-win:
    name: app-win (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}
      - name: Fetch FFmpeg
        run: ./scripts/fetch-ffmpeg.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p glass-win --release
      - name: Smoke test (no GPU/capture on runners)
        shell: bash
        run: |
          target/release/glass.exe --version
          for c in 420 444; do
            f=app-mac/Tests/GlassKitTests/Fixtures/testsrc-$c.glsr
            target/release/glass.exe dump $f t$c.h265
            target/release/glass.exe pack t$c.h265 rt$c.glsr 320 192 60 $c
            cmp $f rt$c.glsr
          done

  app-mac:
    name: app-mac (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p glass-core --release
      - name: swift build
        working-directory: app-mac
        run: swift build -c release
      - name: swift test
        working-directory: app-mac
        run: swift test
      - name: decode bench (fixtures)
        working-directory: app-mac
        run: |
          swift run -c release GlassMac
          swift run -c release GlassMac play Tests/GlassKitTests/Fixtures/testsrc-420.glsr --bench
          swift run -c release GlassMac play Tests/GlassKitTests/Fixtures/testsrc-444.glsr --bench
