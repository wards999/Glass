name: CI

# Actions minutes are limited (private repo: macOS minutes count 10x, Windows
# 2x). So: docs-only pushes don't run CI, a newer push cancels an older run,
# and the Windows/macOS jobs run only when their code (or core) changed.
# Test-build tags always build and publish everything.
on:
  push:
    branches: [main]
    # Test builds: push a tag like m1-test1 to publish a prerelease with the
    # Windows zip and Mac dmg.
    tags: ['m*-test*']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: what changed
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      win: ${{ steps.f.outputs.win }}
      mac: ${{ steps.f.outputs.mac }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            win:
              - 'core/**'
              - 'app-win/**'
              - 'Cargo.*'
              - 'scripts/*win*'
              - 'scripts/fetch-ffmpeg.ps1'
              - '.github/workflows/**'
            mac:
              - 'core/**'
              - 'app-mac/**'
              - 'Cargo.*'
              - 'scripts/*mac*'
              - '.github/workflows/**'

  core:
    name: core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p glass-core --all-targets -- -D warnings
      - run: cargo test -p glass-core
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - name: C header is up to date
        working-directory: core
        run: |
          cbindgen --config cbindgen.toml --output include/glass_core.h
          git diff --exit-code -- include/

  app-win:
    name: app-win (Windows)
    needs: changes
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.win == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe for the build version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}
      - name: Fetch FFmpeg
        run: ./scripts/fetch-ffmpeg.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Package
        run: ./scripts/package-win.ps1
      - name: Smoke test (no GPU/capture on runners)
        shell: bash
        run: |
          export PATH="$PWD/third_party/ffmpeg/bin:$PATH"
          target/release/glass.exe --version
          for c in 420 444; do
            f=app-mac/Tests/GlassKitTests/Fixtures/testsrc-$c.glsr
            target/release/glass.exe dump $f t$c.h265
            target/release/glass.exe pack t$c.h265 rt$c.glsr 320 192 60 $c
            cmp $f rt$c.glsr
          done
      - name: Live stream over loopback (pair, serve -> probe, bit-exact, unpaired refused)
        shell: bash
        run: |
          export PATH="$PWD/third_party/ffmpeg/bin:$PATH"
          f=app-mac/Tests/GlassKitTests/Fixtures/testsrc-444.glsr
          GLASS_HOME=$RUNNER_TEMP/host target/release/glass.exe serve $f --port 47811 --pin 246810 &
          sleep 2
          # Unpaired: refused.
          if GLASS_HOME=$RUNNER_TEMP/viewer target/release/glass.exe probe 127.0.0.1 --port 47811 --seconds 1; then
            echo "unpaired probe was not refused"; exit 1
          fi
          # Pair with the PIN, then stream; then reconnect without a PIN.
          GLASS_HOME=$RUNNER_TEMP/viewer target/release/glass.exe probe 127.0.0.1 --port 47811 --pin 246810 --seconds 3 --verify $f --min-frames 30
          GLASS_HOME=$RUNNER_TEMP/viewer target/release/glass.exe probe 127.0.0.1 --port 47811 --seconds 2 --verify $f --min-frames 20
          GLASS_HOME=$RUNNER_TEMP/host target/release/glass.exe devices
          kill %1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: glass-win
          path: dist/*.zip
          if-no-files-found: error

  app-mac:
    name: app-mac (macOS)
    needs: changes
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.mac == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p glass-core --release
      - name: swift test
        working-directory: app-mac
        run: swift test
      - name: Package (Glass.app + dmg)
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: bash scripts/package-mac.sh
      - name: decode bench (fixtures, packaged binary)
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/glass -nobrowse
          bin=/tmp/glass/Glass.app/Contents/MacOS/GlassMac
          codesign --verify --deep --strict /tmp/glass/Glass.app
          for c in 420 444; do
            "$bin" play app-mac/Tests/GlassKitTests/Fixtures/testsrc-$c.glsr --bench
          done
          hdiutil detach /tmp/glass
      - name: Live viewer smoke test (packaged app <- glass serve)
        # The runner's GUI session may not allow full-screen windows; report, don't fail.
        continue-on-error: true
        run: |
          cargo build -p glass-win --release
          GLASS_HOME=$RUNNER_TEMP/host target/release/glass serve app-mac/Tests/GlassKitTests/Fixtures/testsrc-420.glsr --port 47811 --pin 246810 &
          sleep 2
          hdiutil attach dist/*.dmg -mountpoint /tmp/glass -nobrowse
          GLASS_HOME=$RUNNER_TEMP/viewer perl -e "alarm 60; exec @ARGV" /tmp/glass/Glass.app/Contents/MacOS/GlassMac connect 127.0.0.1:47811 --pin 246810 --seconds 5
          hdiutil detach /tmp/glass
          kill %1 || true
      - name: Mac host smoke test (packaged app, test pattern -> glass probe)
        # Runners are VMs: a hardware HEVC encoder may be missing. Report, don't fail.
        continue-on-error: true
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/glass -nobrowse
          bin=/tmp/glass/Glass.app/Contents/MacOS/GlassMac
          "$bin" check-444 || true
          GLASS_HOME=$RUNNER_TEMP/machost perl -e "alarm 90; exec @ARGV" "$bin" host --test-pattern --pin 246810 --port 47812 --seconds 6 &
          sleep 3
          GLASS_HOME=$RUNNER_TEMP/pcviewer target/release/glass probe 127.0.0.1 --port 47812 --pin 246810 --seconds 4 --min-frames 60
          wait %1
          hdiutil detach /tmp/glass
      - name: Mac -> Mac (packaged app hosts a test pattern, its own viewer connects)
        # Only one Mac exists for real tests (SPEC M3d); this covers the pair.
        continue-on-error: true
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/glass -nobrowse
          bin=/tmp/glass/Glass.app/Contents/MacOS/GlassMac
          GLASS_HOME=$RUNNER_TEMP/machost2 perl -e "alarm 90; exec @ARGV" "$bin" host --test-pattern --pin 246810 --port 47813 --seconds 8 &
          sleep 3
          GLASS_HOME=$RUNNER_TEMP/macviewer perl -e "alarm 60; exec @ARGV" "$bin" connect 127.0.0.1:47813 --pin 246810 --seconds 4
          wait %1
          hdiutil detach /tmp/glass
      - uses: actions/upload-artifact@v4
        with:
          name: glass-mac
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish test build
    # Explicit results: "what changed" is skipped on tags, and a skipped job
    # upstream would otherwise skip this one.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.core.result == 'success' && needs.app-win.result == 'success' && needs.app-mac.result == 'success' }}
    needs: [core, app-win, app-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Glass $GITHUB_REF_NAME (test build)" \
            --notes "Test build from $GITHUB_SHA. Instructions: docs/testing.md."
