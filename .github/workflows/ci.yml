name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p glass-core --all-targets -- -D warnings
      - run: cargo test -p glass-core
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - name: C header is up to date
        working-directory: core
        run: |
          cbindgen --config cbindgen.toml --output include/glass_core.h
          git diff --exit-code -- include/

  app-win:
    name: app-win (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p glass-win --release
      - run: target/release/glass.exe

  app-mac:
    name: app-mac (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p glass-core --release
      - name: swift build
        working-directory: app-mac
        run: swift build
      - name: swift test
        working-directory: app-mac
        run: swift test
      - name: run app
        working-directory: app-mac
        run: swift run GlassMac
