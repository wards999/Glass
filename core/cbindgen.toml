language = "C"
include_guard = "GLASS_CORE_H"
autogen_warning = "/* Generated by cbindgen from core/src. Do not edit; run `cbindgen --config cbindgen.toml --output include/glass_core.h` in core/. */"
usize_is_size_t = true
style = "type"

[export]
prefix = "GLASS_"
include = []

[enum]
prefix_with_name = true
